[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst"
version = "0.1.0"
description = "Autonomous catalyst trading bot - the model proposes, deterministic code disposes"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.setuptools.packages.find]
include = ["catalyst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-q --strict-markers"
markers = [
    "sabotage: negative-control tests that prove other tests can fail",
]
