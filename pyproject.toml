[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst"
version = "0.1.0"
description = "Autonomous catalyst trading bot - the model proposes, deterministic code disposes"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.setuptools.packages.find]
include = ["catalyst*"]

# schema.sql is not a .py file, so it is NOT installed by default - an
# installed copy then imports fine and dies the first time it opens the
# database. Found by running install.sh on a clean machine, which is the
# only place the difference between "the repo" and "the installed
# package" shows up.
[tool.setuptools.package-data]
catalyst = ["storage/*.sql", "storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-q --strict-markers"
markers = [
    "sabotage: negative-control tests that prove other tests can fail",
]
