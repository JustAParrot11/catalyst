[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst"
# Read from catalyst/VERSION, so the packaging metadata cannot drift
# away from what `catalyst.__version__` reports. A second hand-typed
# copy of the series is exactly the thing the owner reported: two
# numbers, one of them stale, and no way to tell which.
#
# The SERIES only (0.3, not 0.3.14): the patch is counted from git at
# import time, and doing that here would run subprocesses during every
# pip install, on a machine that may be mid-rollback.
dynamic = ["version"]
description = "Autonomous catalyst trading bot - the model proposes, deterministic code disposes"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.setuptools.dynamic]
version = {file = "catalyst/VERSION"}

[tool.setuptools.packages.find]
include = ["catalyst*"]

# A .sql file is not a .py file, so it is NOT installed by default - an
# installed copy then imports fine and dies the first time it needs the
# schema. Found once by running install.sh on a clean machine, which is
# the only place the difference between "the repo" and "the installed
# package" shows up.
#
# It then happened AGAIN, because the fix listed directories by hand:
# dashboard/schema_logs.sql arrived later, was never added here, and so
# never shipped. The owner's dashboard was missing it for weeks - and
# because the build hash covers .sql files, the installed copy hashed
# differently from every released version, which is what sent us
# hunting for a phantom second checkout (2026-08-11).
#
# A recursive glob now, so a new .sql file ships by existing rather than
# by being remembered. tests/test_install.py asserts every .sql in the
# tree is covered.
#
# VERSION is here for the same reason and it is not optional: catalyst/
# __init__.py READS it at import time, so an installed copy without it
# does not merely lose its version, it fails to import at all - and
# upgrade.sh reads that as "will not even start" and rolls back.
[tool.setuptools.package-data]
catalyst = ["**/*.sql", "VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-q --strict-markers"
markers = [
    "sabotage: negative-control tests that prove other tests can fail",
]
